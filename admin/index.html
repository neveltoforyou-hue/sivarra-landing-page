<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sivarra Content Manager</title>
  <!-- Explicit Decap CMS config URL -->
  <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
  <!-- Hide Netlify Badge -->
  <style>
    .netlify-badge,
    [class*="netlify-badge"],
    a[href*="netlify.com"][target="_blank"],
    div[id*="netlify-badge"],
    iframe[src*="netlify.com/badge"],
    iframe[title*="Netlify Badge"],
    iframe[title*="badge"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
  <!-- Netlify Identity Widget for authentication -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Netlify Identity & Decap CMS initialization -->
  <script>
    const NETLIFY_SITE_URL = "https://precious-stroopwafel-140f1c.netlify.app";
    // Decap CMS git-gateway backend checks this localStorage key when hosted on external domain
    localStorage.setItem("netlifySiteURL", NETLIFY_SITE_URL);

    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: NETLIFY_SITE_URL + "/.netlify/identity"
      });
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <!-- Decap CMS script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <!-- Dynamic badge cleanup observer -->
  <script>
    const removeBadge = () => {
      document.querySelectorAll('*').forEach(el => {
        if (el.textContent && el.textContent.trim().toLowerCase() === 'powered by netlify' && el.children.length === 0) {
          const badgeContainer = el.closest('div, a, footer, section');
          if (badgeContainer) badgeContainer.remove();
        }
      });
    };
    const observer = new MutationObserver(removeBadge);
    observer.observe(document.documentElement, { childList: true, subtree: true });
    window.addEventListener('load', removeBadge);
  </script>
</body>
</html>
